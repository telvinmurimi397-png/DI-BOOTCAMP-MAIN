<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mtaafix — Community Reports</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="dot"></span> Mtaafix</div>
  <button class="btn ghost menu-toggle" id="menuToggle" type="button" aria-label="Open navigation" aria-expanded="false">&#9776;</button>
  <nav class="nav">
    <span class="badge" id="whoami">Resident</span>
    <button class="btn ghost" id="notifBtn">Alerts <span id="notifCount"></span></button>
    <a class="btn ghost" href="ruler.html">Area ruler</a>
    <button class="btn" id="logoutBtn">Sign out</button>
  </nav>
</header>

<div class="container">
  <div class="stat-row" id="statRow"></div>

  <div id="notifPanel" class="panel hide">
    <div class="row" style="justify-content:space-between">
      <h3 style="margin:0">Your SMS alerts</h3>
      <button class="btn ghost" id="notifClose">Close</button>
    </div>
    <p class="desc">When your area ruler posts a report you receive an AI-written SMS.
      Confirm below to acknowledge you've seen it.</p>
    <div id="notifList"></div>
  </div>

  <div class="filters">
    <div>
      <label>Area</label>
      <select id="fArea"><option value="">All areas</option></select>
    </div>
    <div>
      <label>Category</label>
      <select id="fCat"><option value="">All categories</option></select>
    </div>
    <div>
      <label>Status</label>
      <select id="fStatus"><option value="">Any status</option></select>
    </div>
    <button class="btn" id="refreshBtn">Refresh</button>
  </div>

  <div id="feed" class="grid"></div>
  <div id="empty" class="empty hide">No reports yet. Check back soon.</div>
</div>

<footer>Mtaafix &middot; Residents view &amp; rate &middot; Only area rulers can post</footer>
<div class="toast" id="toast"></div>

<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
