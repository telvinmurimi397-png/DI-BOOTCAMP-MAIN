<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MtaaFix - Resident</title>
  <link rel="stylesheet" href="/frontend/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">MtaaFix</div>
    <nav>
      <button id="logout-btn" class="secondary">Logout</button>
    </nav>
  </header>

  <main class="container">
    <section class="panel">
      <h2>Submit issue</h2>
      <form id="report-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="title">Title</label>
            <input id="title" name="title" type="text" required />
          </div>
          <div class="form-group">
            <label for="area">Area</label>
            <select id="area" name="area"></select>
          </div>
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" name="category"></select>
          </div>
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="4" required></textarea>
        </div>
        <div class="form-row">
          <button type="submit" class="primary">Save report</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2>Your reports</h2>
      <div id="report-list" class="report-list"></div>
    </section>
  </main>

  <script src="/frontend/js/api.js"></script>
  <script src="/frontend/js/ui.js"></script>
  <script src="/frontend/js/app.js"></script>
</body>
</html>
