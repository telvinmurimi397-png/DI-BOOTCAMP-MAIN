<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Planets</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #111827;
        color: white;
        font-family: Arial, sans-serif;
      }

      .planet-container {
        width: 100%;
        max-width: 1200px;
        padding: 30px;
      }

      .listPlanets {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 30px;
        align-items: center;
      }

      .planet {
        position: relative;
        width: 70px;
        height: 70px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: bold;
        color: white;
        text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.6);
        box-shadow: inset -8px -8px 10px rgba(0, 0, 0, 0.2), inset 8px 8px 10px rgba(255, 255, 255, 0.15);
      }

      .moon {
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
      }
    </style>
  </head>
  <body>
    <div class="planet-container">
      <section class="listPlanets"></section>
    </div>

    <script src="./Daily Challeng Planets.js"></script>
  </body>
</html>
