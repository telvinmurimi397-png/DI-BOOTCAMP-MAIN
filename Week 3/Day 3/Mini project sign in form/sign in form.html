<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Double Slider Sign In / Sign Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section>
    <div class="container" id="container">
      
      <!-- Sign In Form -->
      <div class="form sign-in-form">
        <div class="wrapper">
          <form action="#">
            <h1>Sign In</h1>
            <p>Use your email and password to sign in</p>
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
          </form>
        </div>
      </div>

      <!-- Sign Up Form -->
      <div class="form sign-up-form">
        <div class="wrapper">
          <form action="#">
            <h1>Sign Up</h1>
            <p>Please provide all info to create an account</p>
            <input type="text" placeholder="Full Name" required>
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="Password" required>
            <button type="submit">Sign Up</button>
          </form>
        </div>
      </div>

      <!-- Overlay Slider Panel -->
      <div class="overlay-container" id="overlayContainer">
        <div class="overlay" id="overlay">
          
          <div class="overlay-left">
            <h1>Create Account</h1>
            <p>or</p>
            <button id="signInBtn">Log In</button>
          </div>

          <div class="overlay-right">
            <h1>Please, Log In</h1>
            <p>or</p>
            <button id="signUpBtn">Create Account</button>
          </div>

        </div>
      </div>

    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
