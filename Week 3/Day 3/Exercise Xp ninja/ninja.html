<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Events - Exercises XP Ninja</title>
  <style>
    /* Styling for Exercise 1: Tip Calculator */
    #totalTip {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Exercise 1: Calculate the Tip -->
  <section id="exercise-1">
    <h2>Exercise 1: Calculate the Tip</h2>
    <form id="tipForm">
      <p>How much was your bill?
        $<input type="number" id="billAmt" placeholder="Bill Amount">
      </p>

      <p>How was your service?
        <select id="serviceQual">
          <option disabled selected value="0">-- Choose an Option --</option>
          <option value="0.3">30%&#128525; Outstanding</option>
          <option value="0.2">20%&#128515; Good</option>
          <option value="0.15">15%&#128528; Okay</option>
          <option value="0.1">10%&#128533; Bad</option>
          <option value="0.05">5%&#128545; Terrible</option>
        </select>
      </p>

      <p>How many people are sharing the bill?
        <input type="number" id="numOfPeople" placeholder="Number of People"> people
      </p>

      <button type="button" id="calculate">Calculate!</button>
    </form>

    <div id="totalTip">
      <sup>$</sup><span id="tip">0.00</span>
      <small id="each">each</small>
    </div>
  </section>

  <hr>

  <!-- Exercise 2: Validate the Email -->
  <section id="exercise-2">
    <h2>Exercise 2: Validate the Email</h2>
    <form id="emailForm">
      <label for="emailInput">Enter your Email:</label>
      <input type="email" id="emailInput" placeholder="example@domain.com" required>
      <button type="submit">Submit</button>
    </form>
  </section>

  <hr>

  <!-- Exercise 3: Get User's Geolocation Coordinates -->
  <section id="exercise-3">
    <h2>Exercise 3: Get Geolocation</h2>
    <button id="getGeoBtn">Get Location</button>
    <div id="geoOutput"></div>
  </section>

  <script src="main.js"></script>
</body>
</html>
