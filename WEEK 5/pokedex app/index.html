<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex App</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="pokedex-container">
    <div class="screen" id="screen">
      <div id="display-content">Click the middle button to find a Pokémon!</div>
    </div>

    <div class="controls">
      <button id="prev-btn" class="nav-btn"><i class="fa-solid fa-chevron-left"></i></button>
      <button id="random-btn" class="random-btn"><i class="fa-solid fa-shuffle"></i></button>
      <button id="next-btn" class="nav-btn"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
