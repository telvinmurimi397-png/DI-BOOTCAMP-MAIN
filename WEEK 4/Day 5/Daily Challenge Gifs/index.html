<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giphy App - Daily Challenge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>GIF Finder</h1>

  <form id="search-form">
    <input type="text" id="category-input" placeholder="Enter a category (e.g. sun)" required>
    <button type="submit">Fetch GIF</button>
  </form>

  <div class="controls">
    <button id="delete-all-btn">DELETE ALL</button>
  </div>

  <div id="gif-container"></div>

  <script src="script.js"></script>
</body>
</html>
