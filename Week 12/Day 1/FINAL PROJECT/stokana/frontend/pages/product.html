<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product · STOKANA</title>
  <meta name="description" content="View product details, prices, seller information and reviews on STOKANA.">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/main.css">
  <script type="module" src="/js/pages/product.js"></script>
</head>
<body class="page-product">
  <div data-site-header></div>
  <main class="page-bg">
    <div class="container" id="product-page">
      <div class="product-detail">
        <div class="skeleton" style="aspect-ratio:1/0.8;border-radius:var(--radius-lg)"></div>
        <div style="display:grid;gap:14px;align-content:start">
          <div class="skeleton skeleton-line" style="width:40%"></div>
          <div class="skeleton skeleton-line" style="width:90%;height:32px"></div>
          <div class="skeleton skeleton-line" style="width:65%"></div>
          <div class="skeleton" style="height:54px;width:40%;border-radius:10px"></div>
          <div class="skeleton" style="height:210px;border-radius:var(--radius)"></div>
        </div>
      </div>
    </div>
  </main>
  <div data-site-footer></div>
</body>
</html>
