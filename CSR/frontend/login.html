<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#183d32">
  <title>Sign in | GreenFuture</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body class="auth-page">
  <header class="site-header auth-header"><a class="brand" href="index.html"><span class="brand-mark">G</span>greenfuture</a><a class="text-link" href="index.html">Back to home</a></header>
  <main class="auth-layout">
    <section class="auth-aside">
      <p class="eyebrow"><span class="eyebrow-dot"></span> Your work, in good company</p>
      <h1>Welcome <em>back.</em></h1>
      <p>Pick up where your next environmental project begins.</p>
      <div class="aside-rule"><span></span><span>GreenFuture network</span></div>
    </section>
    <section class="auth-panel" aria-labelledby="form-title">
      <p class="section-label">Member access</p>
      <h2 id="form-title">Sign in to your account</h2>
      <p class="form-intro">Good to have you back. Enter your details below.</p>
      <form data-auth-form="login" novalidate>
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.org" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required>
        <p class="form-message" data-form-message role="alert" aria-live="polite"></p>
        <button class="button button-full" type="submit">Sign in</button>
      </form>
      <p class="form-switch">New to GreenFuture? <a href="register.html">Create an account</a></p>
    </section>
  </main>
</body>
</html>
