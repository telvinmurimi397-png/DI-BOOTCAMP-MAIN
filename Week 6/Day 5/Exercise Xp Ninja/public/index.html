<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f1e8">
  <title>Quickfire | Quiz</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/quiz.js" defer></script>
</head>
<body>
  <main class="quiz-shell">
    <header class="topline">
      <a class="wordmark" href="/" aria-label="Quickfire home"><span class="brand-mark" aria-hidden="true">Q</span> QUICKFIRE</a>
      <span class="edition">THE DAILY QUIZ</span>
    </header>

    <section class="quiz" aria-labelledby="quiz-title">
      <div class="intro" id="intro">
        <p class="eyebrow">Six questions. One bright mind.</p>
        <h1 id="quiz-title">Put your<br><span>knowledge</span> to work.</h1>
        <p class="intro-copy">A quick mix of JavaScript and web fundamentals. Your score is tallied as you go.</p>
        <button class="button button-primary" id="start-button" type="button">Start the quiz <span aria-hidden="true">→</span></button>
      </div>

      <div class="game hidden" id="game" aria-live="polite">
        <div class="game-meta">
          <span class="question-count" id="question-count"></span>
          <span class="score" id="score">0 <small>POINTS</small></span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Quiz progress" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0" id="progress-track"><span id="progress-fill"></span></div>
        <h2 class="question" id="question"></h2>
        <form id="answer-form">
          <fieldset class="choices" id="choices">
            <legend class="sr-only">Choose one answer</legend>
          </fieldset>
          <div class="feedback hidden" id="feedback" role="status"></div>
          <div class="actions">
            <button class="button button-primary" id="submit-button" type="submit" disabled>Check answer <span aria-hidden="true">→</span></button>
            <button class="button button-primary hidden" id="next-button" type="button">Next question <span aria-hidden="true">→</span></button>
          </div>
        </form>
      </div>

      <div class="results hidden" id="results" aria-live="polite">
        <p class="eyebrow">That's a wrap</p>
        <h2 id="result-title">Nicely done.</h2>
        <p class="result-score" id="result-score"></p>
        <p class="result-copy" id="result-copy"></p>
        <button class="button button-primary" id="restart-button" type="button">Play again <span aria-hidden="true">↻</span></button>
      </div>
    </section>

    <footer class="footer"><span>BUILT FOR CURIOUS MINDS</span><span>01 — 06</span></footer>
  </main>
</body>
</html>
